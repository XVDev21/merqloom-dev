name: merqloom-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: merqloom
      POSTGRES_DB: merqloom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run the local setup script}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merqloom -d merqloom"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
  redisdata:
